<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undisputed Interest World</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            background-image: url('background.jpg');
            background-color: #f0f4f7;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "Lucida Grande", "Lucida Sans Unicode", Arial, Helvetica, sans-serif;
            color: #444;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
        #container {
            width: 950px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #d1d9e0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
        }
        header {
            background: linear-gradient(180deg, #81d4fa 0%, #4fc3f7 50%, #29b6f6 51%, #039be5 100%);
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid #0288d1;
        }
        header h1 {
            color: white;
            margin: 0;
            font-size: 2.5em;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: -1px;
        }
        #content-wrapper {
            display: flex;
        }
        nav {
            width: 220px;
            background: #f5f5f5;
            padding: 20px 15px;
            border-right: 1px solid #d1d9e0;
            box-sizing: border-box;
        }
        nav a {
            display: block;
            color: #555;
            text-decoration: none;
            padding: 10px 15px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f1f1 50%, #e1e1e1 51%, #f5f5f5 100%);
            border: 1px solid #ccc;
            box-shadow: 0px 2px 2px rgba(0,0,0,0.05);
            transition: 0.2s;
            text-align: center;
        }
        nav a:hover {
            background: #fff;
            color: #039be5;
            border-color: #039be5;
            box-shadow: 0 0 8px rgba(3, 155, 229, 0.3);
        }
        #main-content {
            flex: 1;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content-box {
            background: #ffffff;
            border: 1px solid #d1d9e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content-box img {
            display: block;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .content-box img.spinning {
            animation: spin 0.3s linear infinite;
        }

        footer {
            text-align: center;
            padding: 18px;
            background: #f5f5f5;
            border-top: 1px solid #d1d9e0;
        }
        footer a img {
            vertical-align: middle;
            transition: opacity 0.2s;
        }
        footer a img:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div id="container">
    <header>
        <h1>Undisputed Interest World</h1>
    </header>
    <div id="content-wrapper">
        <nav>
            <a href="index.html">Home</a>
            <a href="vc-games.html">Vibe Coded Games</a>
        </nav>
        <div id="main-content">
            <div class="content-box">
                <img id="logo" src="uxilog.png" width="612" height="373" alt="Undisputed Interest Logo"/>
            </div>
        </div>
    </div>
    <footer>
        <a href="https://www.youtube.com/@undisputedinterest" target="_blank">
            <img src="youtube.png" alt="Undisputed Interest YouTube" width="75" height="75">
        </a>
    </footer>
</div>

<script>
    const logo = document.getElementById('logo');
    let spinTimeout;

    logo.addEventListener('click', () => {
        clearTimeout(spinTimeout);
        logo.classList.add('spinning');
        spinTimeout = setTimeout(() => {
            logo.classList.remove('spinning');
        }, 1000);
    });
</script>
</body>
</html>
